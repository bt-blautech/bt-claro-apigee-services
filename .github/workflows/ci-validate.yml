name: ci-validate

# Paso 2 del caso de uso: validacion automatica en cada push/PR. Falla el pipeline ante cualquier error.
# En PR la ejecuta pr-checks.yml (validacion + preview con pruebas); aqui solo push y llamada reutilizable.
on:
  push:
    branches: [develop, "feature/**"]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: "C2 Validacion (gitleaks, xmllint, schema, bundle, apigeelint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - name: "C8 Escaneo de secretos (gitleaks)"
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source=/repo --redact --verbose --exit-code 1
      - name: "C2 Validar artefacto"
        run: scripts/validate.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-validate-${{ github.run_id }}
          path: evidence/validate/
